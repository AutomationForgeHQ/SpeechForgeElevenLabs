; Files this plugin must carry that BuildPlugin would otherwise leave behind.
;
; The engine's package filter is a closed list - the descriptor, build products,
; Binaries/ThirdParty, Resources, Content, Intermediate/Build/.../Inc, Shaders and
; Source. Everything below is outside it, so without this file it is staged for the
; public and then dropped from the package. See the packaging section of the forge
; README; our own CI enforces the same list and fails the build when one goes missing.
;
; ForgeMachine.json is how the hub learns this plugin's keys and runners. The hub is
; a separate process and cannot ask a plugin anything, so an installed plugin without
; it contributes nothing to the Keys and Runners pages.

[FilterPlugin]
/README.md
/LICENSE
/Config/ForgeMachine.json
